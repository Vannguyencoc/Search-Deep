
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Methodology Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print, .export-print-mode {
        .export-print-mode {
          background-color: #ffffff !important;
          color: #000000 !important;
        }
        .export-print-mode * {
          color: #000000 !important;
          border-color: #e5e7eb !important; /* gray-200 */
          background-color: transparent !important;
          box-shadow: none !important;
          text-shadow: none !important;
        }
        .export-print-mode .bg-white, 
        .export-print-mode .dark\:bg-gray-800\/50,
        .export-print-mode .bg-blue-50\/50,
        .export-print-mode .dark\:bg-blue-900\/10,
        .export-print-mode .bg-indigo-50,
        .export-print-mode .dark\:bg-indigo-900\/20,
        .export-print-mode .bg-blue-50,
        .export-print-mode .dark\:bg-blue-900\/20 {
          background-color: transparent !important;
          border: none !important;
        }
        .export-print-mode .text-gray-900,
        .export-print-mode .dark\:text-white,
        .export-print-mode .text-gray-700,
        .export-print-mode .dark\:text-gray-300,
        .export-print-mode .text-indigo-600\/80,
        .export-print-mode .dark\:text-indigo-400\/80,
        .export-print-mode .text-blue-800,
        .export-print-mode .dark\:text-blue-300,
        .export-print-mode .text-indigo-700,
        .export-print-mode .dark\:text-indigo-400,
        .export-print-mode .text-blue-600,
        .export-print-mode .dark\:text-blue-400 {
          color: #000000 !important;
          opacity: 1 !important;
        }
        .export-print-mode .prose {
          color: #000000 !important;
          max-width: none !important;
        }
        .export-print-mode .prose h2,
        .export-print-mode .prose h3 {
          color: #1e40af !important; /* blue-800 */
          border-bottom: 2px solid #e5e7eb !important;
        }
        .export-print-mode .prose strong {
          color: #000000 !important;
          background-color: transparent !important;
          font-weight: 700 !important;
        }
        .export-print-mode text {
          fill: #000000 !important;
        }
        .export-print-mode line {
          stroke: #94a3b8 !important; /* slate-400 */
          stroke-opacity: 0.6 !important;
        }
        /* Ensure concept map remains visible */
        .export-print-mode .zoom-container * {
          background-color: transparent !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.1",
    "d3": "https://esm.sh/d3@^7.9.0",
    "html2pdf.js": "https://esm.sh/html2pdf.js@^0.10.1",
    "docx": "https://esm.sh/docx@^8.5.0",
    "file-saver": "https://esm.sh/file-saver@^2.0.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
